name: Verify portable skill bundle
"on": [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  offline-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -B scripts/verify_public_bundle.py --workdir "${{ runner.temp }}/safesell-tests"
      - run: python -B scripts/doctor.py
